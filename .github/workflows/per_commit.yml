name: "CI"

on: [push]

jobs:
  Ubuntu:
    runs-on: ubuntu-latest
    outputs:
      cache_misses: ${{ env.cache_misses }}
    steps:
      # 步驟 1: 將您的程式碼下載到虛擬機中
      - uses: actions/checkout@v4 # 更新到 v4 版本

      # 步驟 2: 使用官方 action 來設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5 # 更新到 v5 版本
        with:
          python-version: '3.12.3' # 您可以在此指定需要的 Python 版本

      # 步驟 3: 一次性安裝所有需要的系統套件 (不再需要安裝 python)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            apt-utils \
            git \
            gcc \
            g++ \
            cmake \
            make \
            ninja-build \
            tcpdump \
            libgsl-dev \
            libxml2-dev \
            curl \
            unzip \
            tar \
            ccache

      # 步驟 4: 獲取時間戳 (不需變更)
      - name: Get timestamp
        id: time
        run: python3 -c "from datetime import datetime; print('time='+datetime.now().strftime('%Y-%m-%d-%H-%M-%S'))" >> $GITHUB_ENV

      # 步驟 5: 還原 ccache 快取
      - name: Restore ccache
        id: ccache
        uses: actions/cache@v4 # 更新到 v4 版本
        with:
          path: .ccache
          key: ubuntu-ci-${{env.time}}
          restore-keys: ubuntu-ci-

      # 步驟 6: 設定 ccache (不需變更)
      - name: Setup ccache
        run: |
          ccache --set-config=cache_dir="$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=max_size=400M
          ccache --set-config=compression=true
          ccache -z

      # 步驟 7: 設定 CMake (不需變更)
      - name: Configure CMake
        run: |
          ./ns3 configure -d release --enable-asserts --enable-examples --enable-tests --disable-werror -G"Ninja"

      # 步驟 8: 編譯 ns-3 (不需變更)
      - name: Build ns-3
        run: |
          ./ns3 build

      # 步驟 9: 打印 ccache 統計 (不需變更)
      - name: Print ccache statistics
        id: ccache_results
        run: |
          ccache -s
          python3 -c "import re, subprocess;print('cache_misses=%d' % int(re.findall('cache_miss(.*)', subprocess.check_output(['ccache', '--print-stats']).decode())[0]))" >> $GITHUB_ENV

      # 步驟 10: 執行測試與範例 (不需變更)
      - name: Run tests and examples
        if: env.cache_misses != '0'
        run: python3 test.py --no-build

  CodeQL:
    runs-on: ubuntu-latest
    needs: Ubuntu # 確保這個 job 依賴於您主要的 Ubuntu build job
    if: needs.Ubuntu.outputs.cache_misses != '0' # 僅在有快取未命中 (即有重新編譯) 時執行
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # 更新到 v4

      # 步驟 1: 使用官方 action 來設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 步驟 2: 初始化 CodeQL 工具
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3 # 更新到 v3
        with:
          languages: 'cpp'

      # 步驟 3: 一次性安裝所有需要的系統套件 (不再需要安裝 python)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            apt-utils \
            git \
            gcc \
            g++ \
            cmake \
            make \
            ninja-build \
            tcpdump \
            libgsl-dev \
            libxml2-dev \
            curl \
            unzip \
            tar \
            ccache

      # 步驟 4: 獲取時間戳 (不需變更)
      - name: Get timestamp
        id: time
        run: python3 -c "from datetime import datetime; print('time='+datetime.now().strftime('%Y-%m-%d-%H-%M-%S'))" >> $GITHUB_ENV

      # 步驟 5: 還原 ccache 快取
      - name: Restore ccache
        id: ccache
        uses: actions/cache@v4 # 更新到 v4
        with:
          path: .ccache
          key: ubuntu-ci-${{env.time}}
          restore-keys: ubuntu-ci-

      # 步驟 6: 設定 ccache (不需變更)
      - name: Setup ccache
        run: |
          ccache --set-config=cache_dir="$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=max_size=400M
          ccache --set-config=compression=true
          ccache -z

      # 步驟 7: 設定 CMake (不需變更)
      - name: Configure CMake
        run: |
          ./ns3 configure -d release --enable-asserts --enable-examples --enable-tests --disable-werror -G"Ninja"

      # 步驟 8: 編譯 ns-3 (CodeQL 需要這一步來分析程式碼)
      - name: Build ns-3
        run: |
          ./ns3 build

      # 步驟 9: 執行 CodeQL 分析
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3 # 更新到 v3

  Codecov:
    runs-on: ubuntu-latest
    needs: Ubuntu # 確保這個 job 依賴於您主要的 Ubuntu build job
    if: needs.Ubuntu.outputs.cache_misses != '0' # 僅在有重新編譯時執行
    steps:
      # 步驟 1: 下載程式碼
      - uses: actions/checkout@v4

      # 步驟 2: 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 步驟 3: 安裝所有系統依賴 (包含 lcov)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            apt-utils \
            git \
            gcc \
            g++ \
            cmake \
            make \
            ninja-build \
            tcpdump \
            libgsl-dev \
            libxml2-dev \
            curl \
            unzip \
            tar \
            ccache \
            lcov

      # 步驟 4: 設定 CMake (啟用 Gcov)
      - name: Configure CMake for Coverage
        run: |
          ./ns3 configure --enable-asserts --enable-examples --enable-tests --disable-werror --enable-gcov -G"Ninja"

      # 步驟 5: 編譯 ns-3
      - name: Build ns-3
        run: |
          ./ns3 build

      # 步驟 6: 執行測試 (這是產生覆蓋率數據的關鍵步驟！)
      - name: Run tests to generate coverage data
        run: python3 test.py --no-build

      # 步驟 7: 使用 lcov 收集覆蓋率數據
      - name: Generate coverage report
        run: |
          # 從 cmake-cache 目錄中收集所有 .gcno 和 .gcda 檔案的數據
          lcov --capture --directory ./cmake-cache --output-file ns3.info
          # (可選) 移除系統標頭檔和外部函式庫的覆蓋率，讓報告更乾淨
          lcov --remove ns3.info '/usr/*' '*/bits/*' --output-file ns3.info

      # 步驟 8: 使用官方 Codecov Action 上傳報告 (v5 版本)
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # 建議設定 repo secret
          files: ./ns3.info # 明確指定報告檔案
          fail_ci_if_error: true # 如果上傳失敗，則讓 CI 失敗

  Windows_MinGW:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v3
      - uses: msys2/setup-msys2@v2
      - name: Install required msys2/mingw64 packages
        run: |
          pacman -S --noconfirm unzip
          pacman -S --noconfirm tar
          pacman -S --noconfirm mingw-w64-x86_64-curl
          pacman -S --noconfirm mingw-w64-x86_64-binutils
          pacman -S --noconfirm mingw-w64-x86_64-cmake
          pacman -S --noconfirm mingw-w64-x86_64-gcc
          pacman -S --noconfirm mingw-w64-x86_64-ninja
          pacman -S --noconfirm mingw-w64-x86_64-python
          pacman -S --noconfirm mingw-w64-x86_64-ccache
          pacman -S --noconfirm mingw-w64-x86_64-gsl
          pacman -S --noconfirm mingw-w64-x86_64-libxml2
          pacman -S --noconfirm mingw-w64-x86_64-lld
          pacman --noconfirm -Scc
      - name: Get timestamp
        id: time
        run: python3 -c "from datetime import datetime; print('time='+datetime.now().strftime('%Y-%m-%d-%H-%M-%S'))" >> $GITHUB_ENV
      - name: Restore ccache
        id: ccache
        uses: actions/cache@v3
        with:
          path: .ccache
          key: msys2-${{env.time}}
          restore-keys: msys2-
      - name: Setup ccache
        run: |
          ccache --set-config=cache_dir="$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=max_size=400M
          ccache --set-config=compression=true
          ccache -z
      - name: Configure CMake
        run: |
          python3 ns3 configure -d release --enable-asserts --enable-examples --enable-tests --disable-werror -G"Ninja"
      - name: Build ns-3
        run: |
          python3 ns3 build
      - name: Print ccache statistics
        id: ccache_results
        run: |
          ccache -s
          python3 -c "import re, subprocess;print('cache_misses=%d' % int(re.findall('cache_miss(.*)', subprocess.check_output(['ccache', '--print-stats']).decode())[0]))" >> $GITHUB_ENV
      - name: Run tests and examples
        if: env.cache_misses != '0'
        run: python3 test.py --no-build

  Mac_OS_X:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install required packages
        run: |
          brew install ninja cmake ccache libxml2 gsl open-mpi #qt5
      - name: Get timestamp
        id: time
        run: python3 -c "from datetime import datetime; print('time='+datetime.now().strftime('%Y-%m-%d-%H-%M-%S'))" >> $GITHUB_ENV
      - name: Restore ccache
        id: ccache
        uses: actions/cache@v3
        with:
          path: .ccache
          key: osx_brew-ci-${{env.time}}
          restore-keys: osx_brew-ci-
      - name: Setup ccache
        run: |
          export PATH=/usr/local/bin:$PATH #:/usr/local/opt/qt/bin
          ccache --set-config=cache_dir="$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=max_size=400M
          ccache --set-config=compression=true
          ccache -z
      - name: Configure CMake
        run: |
          export PATH=/usr/local/bin:$PATH #:/usr/local/opt/qt/bin
          ./ns3 configure -d release --enable-asserts --enable-examples --enable-tests --disable-werror -G"Ninja"
      - name: Build ns-3
        run: |
          export PATH="$PATH" #:/usr/local/opt/qt/bin
          ./ns3 build
      - name: Print ccache statistics
        id: ccache_results
        run: |
          ccache -s
          python3 -c "import re, subprocess;print('cache_misses=%d' % int(re.findall('cache_miss(.*)', subprocess.check_output(['ccache', '--print-stats']).decode())[0]))" >> $GITHUB_ENV
      - name: Run tests and examples
        if: env.cache_misses != '0'
        run: ./test.py --no-build
